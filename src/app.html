<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<title>FumetoReaderPlus — Manga Translator</title>
		<meta name="description" content="LLM-powered Japanese manga translation reader" />
		<script>
			// Apply saved color scheme before first paint to prevent flash of default colors.
			// Only runs for non-default schemes; Synthesis defaults come from @theme in CSS.
			// Legacy scheme ids (pre-tonal) are normalized here AND in color-schemes.ts.
			// The document language is set the same way, before Svelte boots, so the
			// first paint already hyphenates and announces in the right language.
			// The tag list is generated from src/lib/i18n/locales.ts — the i18n gate
			// fails when the two disagree.
			try {
				var raw = localStorage.getItem('fumetoreaderplus-settings');
				var setting = raw ? JSON.parse(raw).uiLocale : undefined;
				// @generated-ui-locales:start (scripts/i18n-gate.mjs --check)
				var TAGS = ["en","de","es","fr","id","it","pt-BR","ru"];
				// @generated-ui-locales:end
				var lang = null;
				if (typeof setting === 'string' && setting !== 'system' && TAGS.indexOf(setting) !== -1) lang = setting;
				if (!lang) {
					var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
					for (var i = 0; i < langs.length && !lang; i++) {
						var l = String(langs[i] || '').toLowerCase();
						var base = l.split('-')[0];
						if (base === 'in') base = 'id';
						for (var t = 0; t < TAGS.length; t++) {
							var tag = TAGS[t].toLowerCase();
							if (tag === l || tag.split('-')[0] === base) { lang = TAGS[t]; break; }
						}
					}
				}
				document.documentElement.lang = lang || 'en';
			} catch(e) {}
			try {
				var s = localStorage.getItem('fumetoreaderplus-settings');

						'white': 'synthesis', 'light-blue': 'synthesis', 'light-red': 'synthesis',
						'light-green': 'synthesis', 'light-pink': 'synthesis'
					};
					cs = LEGACY[cs] || cs;

":"#0f131c"},"t":{"surface-base":"#0f131c","surface-container-lowest":"#0a0e17","surface-container-low":"#181b25","surface-container":"#1c2029","surface-container-high":"#262a33","surface-container-highest":"#31353f","on-surface":"#dfe2ef","on-surface-variant":"#c0c6d9","outline":"#8a90a2","outline-variant":"#404756","accent":"#adc6ff","accent-strong":"#1b6ee1","on-accent":"#002e6a","on-accent-strong":"#edf0ff","accent-container":"#004395","on-accent-container":"#d8e2ff"}},"red":{"p":{"50":"#fff8f7","100":"#ffedeb","200":"#ffdad7","300":"#ffc7c2","400":"#ffb3ad","500":"#ff8982","600":"#d63235","700":"#b91a24","800":"#930013","900":"#68000a"},"s":{"50":"#fff8f7","100":"#ffedeb","200":"#f9dcd9","300":"#e3bebb","400":"#c6a3a0","500":"#aa8986","600":"#5b403e","700":"#362625","800":"#2b1c1a","900":"#271817","950":"#1e100f"},"t":{"surface-base":"#1e100f","surface-container-lowest":"#180b0a","surface-container-low":"#271817","surface-container":"#2b1c1a","surface-container-high":"#362625","surface-container-highest":"#42302f","on-surface":"#f9dcd9","on-surface-variant":"#e3bebb","outline":"#aa8986","outline-variant":"#5b403e","accent":"#ffb3ad","accent-strong":"#d63235","on-accent":"#68000a","on-accent-strong":"#ffedeb","accent-container":"#930013","on-accent-container":"#ffdad7"}},"purple":{"p":{"50":"#fff7fe","100":"#faecff","200":"#f0dbff","300":"#e7c9ff","400":"#ddb7ff","500":"#ca93ff","600":"#9945e8","700":"#842bd2","800":"#6900b3","900":"#490080"},"s":{"50":"#fff7fe","100":"#f8edfc","200":"#eadfed","300":"#cfc2d7","400":"#b4a7bb","500":"#988ca0","600":"#4d4354","700":"#2e2832","800":"#231d28","900":"#1f1923","950":"#16111b"},"t":{"surface-base":"#16111b","surface-container-lowest":"#110c16","surface-container-low":"#1f1923","surface-container":"#231d28","surface-container-high":"#2e2832","surface-container-highest":"#39323d","on-surface":"#eadfed","on-surface-variant":"#cfc2d7","outline":"#988ca0","outline-variant":"#4d4354","accent":"#ddb7ff","accent-strong":"#9945e 							// @generated-schemes:end
						var scheme = T[cs];
						if (scheme) {
							var r = document.documentElement;
							for (var k in scheme.p) r.style.setProperty('--color-primary-' + k, scheme.p[k]);
							for (var k in scheme.s) r.style.setProperty('--color-surface-' + k, scheme.s[k]);
							for (var k in scheme.t) r.style.setProperty('--color-' + k, scheme.t[k]);
						}
					}
				}
			} catch(e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
