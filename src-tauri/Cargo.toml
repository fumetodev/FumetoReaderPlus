[package]
name = "fumeto-reader-plus"
version = "0.7.3"
description = "FumetoReaderPlus manga and comic reader with AI translation"
authors = ["FumetoDev"]
license = "GPL-3.0-only"
repository = "https://github.com/fumetodev/FumetoReaderPlus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }
cmake = "0.1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

# Desktop-only additions. Cargo unifies features per target, so neither
# reaches the Android build: `watch` pulls in the notify crates behind the
# library folder watcher, and `devtools` enables right-click Inspect Element
# plus the remote inspector on release builds — on Android that same feature
# would turn on WebView debugging in the shipped APK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.10.0", features = ["devtools"] }
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
