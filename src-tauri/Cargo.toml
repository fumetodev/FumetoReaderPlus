[package]
name = "fumeto-reader-plus"
version = "0.7.3"
description = "FumetoReaderPlus manga and comic reader with AI translation"
authors = ["FumetoDev"]
license = "GPL-3.0-only"
repository = "https://github.com/fumetodev/FumetoReaderPlus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }
cmake = "0.1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

# Desktop-only (never Android/iOS). With resolver 2 these features and crates
# do not reach the mobile builds.
# - fs `watch`: the library folder watcher (src/lib/library/library-watcher.ts).
# - persisted-scope: keeps the access a folder picker grants (e.g. a library on
#   /Volumes/...) across restarts. Pinned exactly: 2.3.6 is the newest release
#   that accepts the locked tauri 2.10 / plugin-fs 2.5.0. 2.3.7+ asks for a newer
#   plugin-fs and cargo then moves tauri to 2.12, which would drag the npm
#   @tauri-apps packages (and Android) along with it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
tauri-plugin-persisted-scope = "=2.3.6"
# Remembers the window's size and position. 2.4.x accepts tauri 2.10; 2.5
# needs 2.12 (same reason as the pin above).
tauri-plugin-window-state = "~2.4.1"

# macOS-only: the background-translation keep-awake activity (keep_awake.rs)
# and the memory figures (system_memory.rs). All three crates are already in
# the tree through tauri; only features are added.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
