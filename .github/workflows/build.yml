name: Build & Release

on:
  # Desktop bundles are built manually when wanted. Every run uploads the
  # bundles as workflow artifacts; a draft GitHub release is created only when
  # the workflow is dispatched on a tag ("Use workflow from" → a tag).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    name: Verify (check + unit tests)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same pin as the build job — see the comment there.
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      # The repository has no test runner dependency; install one without
      # touching package.json (see tests/unit/README.md).
      - name: Unit tests
        run: |
          npm install --no-save vitest@3 fake-indexeddb@6
          npx vitest run --dir tests/unit

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. tauri.macos.conf.json ad-hoc signs the bundle
          # and build.rs compiles llama.cpp for the M1 baseline.
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64
          - platform: windows-latest
            target: ''
            label: Windows-x86_64
          - platform: ubuntu-22.04
            target: ''
            label: Linux-x86_64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux: install system dependencies for WebKitGTK and app indicator
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24 is the Active LTS and the lowest line that satisfies every
          # dependency's `engines.node`. `.npmrc` sets engine-strict=true, so a
          # single unsatisfied range fails `npm ci` outright — which is what
          # broke the v0.5.0 and v0.5.1 tag builds on node 20:
          #   @asamuzakjp/css-color  ^22.13.0 || >=24.0.0
          #   jsdom                  ^22.22.2 || ^24.15.0 || >=26.0.0
          # Note jsdom's range excludes 23 and 25 entirely, so this is NOT
          # safe to float to `latest`/`node-version-file` without rechecking.
          # Verified 2026-08-26 against the installed tree: 22.23.2, 24.20.0
          # and 26.8.0 satisfy every range; 20.20.2 and 25.9.0 do not.
          node-version: 24
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target || 'default' }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target || 'default' }}-

      # The restored cache can carry bundles from an earlier run (another
      # version's file name survives the rebuild); never upload those.
      - name: Remove cached bundles
        shell: bash
        run: rm -rf src-tauri/target/*/release/bundle src-tauri/target/release/bundle

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS bundles are ad-hoc signed (signingIdentity "-" in
          # tauri.macos.conf.json). For a Developer ID-signed, notarized build,
          # set these secrets instead:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # A draft release only for a run dispatched on a tag. On a branch
          # these are empty, and tauri-action then only builds (the bundles
          # are uploaded as artifacts below) — `github.ref_name` would
          # otherwise name a release after the branch.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('FumetoReaderPlus {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets below to download and install FumetoReaderPlus for your platform.'
          releaseDraft: true
          prerelease: false

      # Fails the run if the bundle is not ad-hoc signed, or if llama.cpp was
      # compiled for the runner's CPU rather than the fixed M1 baseline that
      # build.rs pins (GGML_NATIVE off + GGML_CPU_ARM_ARCH).
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/FumetoReaderPlus.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee codesign-info.txt
          grep -q '^Signature=adhoc$' codesign-info.txt
          cache="$(ls -t src-tauri/target/${{ matrix.target }}/release/build/fumeto-reader-plus-*/out/build/CMakeCache.txt | head -n 1)"
          echo "llama.cpp CMake cache: $cache"
          grep -x 'GGML_NATIVE:BOOL=OFF' "$cache"
          grep -x 'GGML_CPU_ARM_ARCH:STRING=armv8.4-a+dotprod+fp16' "$cache"

      # Single-file bundles only: upload-artifact drops the executable bit, so
      # a bare .app would arrive broken. The .dmg carries the .app intact.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: FumetoReaderPlus-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
