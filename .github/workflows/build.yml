name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x86_64
          - platform: windows-latest
            target: ''
            label: Windows-x86_64
          - platform: ubuntu-22.04
            target: ''
            label: Linux-x86_64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux: install system dependencies for WebKitGTK and app indicator
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24 is the Active LTS and the lowest line that satisfies every
          # dependency's `engines.node`. `.npmrc` sets engine-strict=true, so a
          # single unsatisfied range fails `npm ci` outright — which is what
          # broke the v0.5.0 and v0.5.1 tag builds on node 20:
          #   @asamuzakjp/css-color  ^22.13.0 || >=24.0.0
          #   jsdom                  ^22.22.2 || ^24.15.0 || >=26.0.0
          # Note jsdom's range excludes 23 and 25 entirely, so this is NOT
          # safe to float to `latest`/`node-version-file` without rechecking.
          # Verified 2026-08-26 against the installed tree: 22.23.2, 24.20.0
          # and 26.8.0 satisfy every range; 20.20.2 and 25.9.0 do not.
          node-version: 24
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target || 'default' }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target || 'default' }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional — set these secrets for signed builds)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing (optional)
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # Create a GitHub release when triggered by a tag push
          tagName: ${{ github.ref_name }}
          releaseName: 'FumetoReaderPlus ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install FumetoReaderPlus for your platform.'
          releaseDraft: true
          prerelease: false
