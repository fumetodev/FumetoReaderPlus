name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Node 24: .npmrc sets engine-strict, and the dependency tree rejects
      # Node 20/23/25 outright (same rationale as build.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # JDK 21 exactly — newer JDKs are not supported by this Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/gen/android/.cxx
          key: android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/llama-bridge/llama.cpp-version.txt') }}

      - run: npm ci

      # Distribution keystore (NOT the Play upload key) from repo secrets.
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p src-tauri/gen/android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/keystore/github-distribution.jks
          cat > src-tauri/gen/android/app/key.properties <<EOF
          storeFile=../keystore/github-distribution.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Direct build — release:android is the local ladder (preflight demands a
      # clean worktree and the versionCode ledger); CI only needs the artifact.
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
          VITE_FUMETO_DEBUG_UI_FIXTURES: '0'
          VITE_FUMETO_PSEUDOLOCALE: '0'
        run: npx tauri android build --apk

      - name: Rename artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}; VERSION=${VERSION%%-*}
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "fumeto-${VERSION}-release.apk"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: fumeto-*-release.apk
